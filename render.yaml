services:
  - type: web
    name: mtm-api
    runtime: node
    plan: starter
    buildCommand: npm run api:build
    startCommand: node apps/api/dist/main
    rootDir: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: mtm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000

databases:
  - name: mtm-db
    plan: starter
