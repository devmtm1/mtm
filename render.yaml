# Production, décrite ici et créée par le Blueprint Render (branche « main »).
#
# L'environnement de test n'est PAS décrit dans ce fichier : ce sont les
# services créés à la main lors des premiers essais, qu'on garde tels quels
# en les faisant suivre la branche « develop » (Settings → Branch) :
#
#   API          https://mtm-2-v2wo.onrender.com      (build : npm run api:build)
#   back-office  https://mtm-4.onrender.com           (build : npm run backoffice:build:staging)
#   site public  https://mtm-public-web.onrender.com  (build : npm run public-web:build,
#                                                      VITE_API_URL = API de test)
#
# Les sites de production, eux, sont sur Cloudflare Pages (voir README).
#
# Les valeurs marquées « sync: false » sont saisies dans le tableau de bord
# Render : elles n'ont rien à faire dans le dépôt.

services:
  - type: web
    name: mtm-api
    runtime: node
    plan: starter
    # Frankfurt : la région la plus proche du Sénégal parmi celles de Render.
    # La base Neon de production doit être dans la même région (eu-central-1),
    # sinon chaque requête SQL paie la distance.
    region: frankfurt
    branch: main
    rootDir: .
    buildCommand: npm run api:build
    startCommand: node apps/api/dist/main.js
    # Migrations versionnées puis seed (idempotent : rôles, permissions et
    # paramètres manquants sont ajoutés, rien d'existant n'est écrasé).
    # Jamais « db push --accept-data-loss » : il supprimerait sans prévenir
    # toute colonne absente du schéma.
    releaseCommand: cd apps/api && npx prisma migrate deploy && npx prisma db seed
    # Render attend que l'API réponde avant de lui envoyer le trafic : pas de
    # fenêtre d'erreur pendant un déploiement.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Avec NODE_ENV=production, npm n'installe pas les dépendances de
      # développement — or la compilation en a besoin (TypeScript, @types,
      # CLI Prisma, ts-node pour le seed). Cette variable force leur
      # installation au build ; l'API tourne quand même en mode production.
      - key: NPM_CONFIG_PRODUCTION
        value: false
      # Nom affiché dans les journaux et les alertes, pour ne jamais confondre
      # une trace de test avec une trace de production.
      - key: APP_ENV
        value: production
      - key: API_PORT
        value: 3000
      # Base PostgreSQL de production (projet Neon dédié).
      - key: DATABASE_URL
        sync: false
      # Secrets propres à la production : jamais les mêmes qu'en test, sinon
      # un jeton émis sur l'environnement de test ouvre la production.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Tant que l'API et les sites sont sur des domaines différents
      # (onrender.com / pages.dev), le cookie de session doit être SameSite=None.
      # Dès que tout sera sous mtm-immobilier.sn, repasser à « lax ».
      - key: REFRESH_COOKIE_SAME_SITE
        value: none
      # Origines autorisées, séparées par des virgules, sans barre oblique
      # finale : back-office ET site public de production.
      - key: CORS_ORIGIN
        sync: false
      # URL publique du site vitrine : liens d'invitation à l'espace client.
      - key: PUBLIC_WEB_URL
        sync: false
      # URL publique de l'API, préfixe /api inclus : liens signés vers les documents.
      - key: API_PUBLIC_URL
        sync: false
      # Racine des fichiers envoyés sur Cloudinary : sépare les images de
      # production de celles des essais, même si le compte est partagé.
      - key: CLOUDINARY_FOLDER
        value: mtm-prod
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # URL du back-office de production : liens dans les e-mails internes.
      - key: BACKOFFICE_URL
        sync: false
      # E-mails transactionnels : indispensables en production (réinitialisation
      # de mot de passe, invitation espace client, notifications de demandes).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
      # Compte administrateur initial : créé par le seed au premier déploiement.
      # Le mot de passe peut être retiré ensuite (le seed ne l'exige que tant
      # que le compte n'existe pas).
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
