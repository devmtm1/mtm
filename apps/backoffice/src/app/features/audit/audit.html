<div class="audit-page">
  <section class="audit-panel" aria-labelledby="audit-list-title">
    <header class="audit-header">
      <div>
        <span class="audit-eyebrow">Administration</span>
        <h1 id="audit-list-title">Journal d'audit</h1>
        <p>Suivez les actions réalisées dans le back-office.</p>
      </div>
      <span class="audit-total" aria-live="polite">{{ total() }} entrée{{ total() > 1 ? 's' : '' }}</span>
    </header>

    <div class="audit-filters" role="search">
      <mat-form-field appearance="outline" class="audit-filter-field">
        <mat-label>Type d'entité</mat-label>
        <mat-select [(ngModel)]="entityTypeFilter" (selectionChange)="applyFilters()">
          <mat-option value="">Tous</mat-option>
          @for (type of entityTypes; track type) {
            <mat-option [value]="type">{{ type }}</mat-option>
          }
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline" class="audit-filter-field audit-filter-field--action">
        <mat-label>Action</mat-label>
        <input matInput [(ngModel)]="actionFilter" placeholder="ex: user.created" (keyup.enter)="applyFilters()" />
      </mat-form-field>

      <button mat-stroked-button type="button" (click)="applyFilters()">Filtrer</button>
    </div>

    <ag-grid-angular
      class="audit-grid"
      [theme]="theme"
      [rowData]="rowData()"
      [columnDefs]="columnDefs"
      [loading]="loading()"
      [animateRows]="true"
      domLayout="autoHeight"
      [pagination]="true"
      [paginationPageSize]="10"
      [headerHeight]="46"
      [rowHeight]="48"
    />
  </section>
</div>
