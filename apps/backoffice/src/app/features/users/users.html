<div class="users-page">
  <div class="users-header">
    <div class="users-heading">
      <span class="users-eyebrow">Administration</span>
      <h1>Utilisateurs</h1>
      <p>Gérez les comptes, les rôles et l’accès au back-office.</p>
    </div>
    <div class="users-header__actions">
      @if (canCreate()) {
        <button mat-flat-button color="primary" class="btn-mtm-primary users-create-button" (click)="openCreateDialog()">
          <svg lucideUserPlus class="btn-icon" aria-hidden="true"></svg>
          <span>Nouvel utilisateur</span>
        </button>
      }
    </div>
  </div>

  <section class="users-table-shell" aria-labelledby="users-list-title">
    <div class="users-table-toolbar">
      <div>
        <h2 id="users-list-title">Liste des comptes</h2>
          <p aria-live="polite">{{ rowData().length }} compte{{ rowData().length > 1 ? 's' : '' }} autorisé{{ rowData().length > 1 ? 's' : '' }}</p>
      </div>
      <span class="users-table-toolbar__status">Accès back-office</span>
    </div>

    <ag-grid-angular
      class="users-grid"
      [theme]="theme"
      [rowData]="rowData()"
      [defaultColDef]="defaultColDef"
      [columnDefs]="columnDefs"
      [loading]="loading()"
      [animateRows]="true"
      domLayout="autoHeight"
      [pagination]="true"
      [paginationPageSize]="10"
      [headerHeight]="46"
      [rowHeight]="52"
    />
  </section>
</div>
