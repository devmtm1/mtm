<div class="settings-page">
  <div class="settings-header">
    <div>
      <span class="settings-eyebrow">Administration</span>
      <h1>Paramètres</h1>
      <p>Configurez les valeurs utilisées par le back-office.</p>
    </div>
    @if (canCreate()) {
      <button mat-flat-button color="primary" class="btn-mtm-accent" (click)="openCreateDialog()">
        <svg lucideSlidersHorizontal class="btn-icon"></svg>
        Nouveau paramètre
      </button>
    }
  </div>

  <section class="settings-table-shell" aria-labelledby="settings-list-title">
    <div class="settings-table-toolbar">
      <div>
        <h2 id="settings-list-title">Configuration de l’application</h2>
        <p>{{ rowData().length }} paramètre{{ rowData().length > 1 ? 's' : '' }} configuré{{ rowData().length > 1 ? 's' : '' }}</p>
      </div>
      <span class="settings-table-toolbar__hint">Valeurs sensibles protégées</span>
    </div>
    <ag-grid-angular
      class="settings-grid"
      [theme]="theme"
      [rowData]="rowData()"
      [columnDefs]="columnDefs"
      [loading]="loading()"
      [animateRows]="true"
      domLayout="autoHeight"
      [pagination]="true"
      [paginationPageSize]="10"
      [headerHeight]="46"
      [rowHeight]="52"
    />
  </section>
</div>
