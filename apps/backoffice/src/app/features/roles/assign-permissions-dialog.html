<h2 mat-dialog-title class="permissions-dialog-title">
  <span>Permissions</span>
  <small>{{ data.role.name }}</small>
</h2>

<mat-dialog-content class="permissions-dialog-content">
  @if (loading()) {
    <p class="permissions-dialog-loading">Chargement des permissions...</p>
  } @else {
    @for (group of groups(); track group.resource) {
      <section class="permissions-group" [attr.aria-labelledby]="'permission-group-' + group.resource">
        <h3 class="permissions-group-title" [id]="'permission-group-' + group.resource">{{ group.resource }}</h3>
        <div class="permissions-group-items">
          @for (permission of group.permissions; track permission.id) {
            <mat-checkbox
              [checked]="isChecked(permission.name)"
              (change)="toggle(permission.name)"
            >
              {{ permission.action }}
            </mat-checkbox>
          }
        </div>
      </section>
    }
  }
</mat-dialog-content>

<mat-dialog-actions class="permissions-dialog-actions" align="end">
  <button mat-button type="button" (click)="cancel()">Annuler</button>
  <button
    mat-flat-button
    color="primary"
    type="button"
    [disabled]="saving() || loading()"
    (click)="save()"
  >
    Enregistrer
  </button>
</mat-dialog-actions>
