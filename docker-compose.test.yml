# Base PostgreSQL jetable pour les tests e2e de l'API (voir apps/api/test/helpers/e2e-app.ts).
#
#   docker compose -f docker-compose.test.yml up -d
#   E2E_DATABASE_URL=postgresql://mtm_test:mtm_test@localhost:5433/mtm_immobilier_test npm run test:e2e -w apps/api
#
# Port 5433 pour ne jamais entrer en collision avec la base de développement (5432).
# Le nom se termine par _test : c'est la condition pour que les suites acceptent
# de vider les tables.
services:
  postgres-test:
    image: postgres:16-alpine
    container_name: mtm-postgres-test
    environment:
      POSTGRES_USER: mtm_test
      POSTGRES_PASSWORD: mtm_test
      POSTGRES_DB: mtm_immobilier_test
    ports:
      - "5433:5432"
    tmpfs:
      # Données en mémoire : rapide et rien ne survit à l'arrêt du conteneur.
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtm_test -d mtm_immobilier_test"]
      interval: 2s
      timeout: 3s
      retries: 20
